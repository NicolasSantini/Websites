<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina non trovata · Le Linci</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14224a; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
    h1 { font-size: 2.5rem; margin: 0; text-transform: uppercase; }
    a { color: #f5ea2a; font-weight: 600; }
  </style>
  <script>
    // Vecchi indirizzi WordPress -> nuovo sito. Funziona su qualsiasi hosting statico
    // (GitHub Pages e Netlify mostrano questa pagina per ogni indirizzo che non esiste).
    (function () {
      var path = location.pathname;
      var parti = path.split('/').filter(Boolean);
      // Il sito può stare nella radice del dominio (corriconlelinci.com/) o in una sottocartella
      // (es. nicolassantini.github.io/Websites/): si prova quale cartella contiene davvero il sito.
      var candidati = ['/'];
      for (var k = 1; k <= Math.min(2, parti.length); k++) candidati.push('/' + parti.slice(0, k).join('/') + '/');
      var nuove = {
        'il-branco': 'branco.html', 'about': 'contatti.html', 'effemeride': 'eventi.html', 'graduatoria': 'notizia.html?pagina=graduatoria',
        'trail-sul-trebbio': 'trail-sul-trebbio.html', 'abbigliamento': 'branco.html#abbigliamento',
        'sveglia-presto-running': 'eventi.html#sveglia-presto', 'sotto-la-luna-e-la-torre': 'eventi.html#sotto-la-luna'
      };
      function destinazione(resto) {
        var art = resto.match(/^\/\d{4}\/\d{2}\/\d{2}\/([^/]+)/);
        if (art) return 'notizia.html?articolo=' + art[1];
        var p = resto.split('/').filter(Boolean);
        if (!p.length) return null;
        if (p[0] === 'category' || p[0] === 'tag' || /^\d{4}$/.test(p[0])) return 'archivio.html';
        if (p[0].indexOf('.') !== -1) return null;
        var slug = p[p.length - 1];
        return nuove[slug] || 'notizia.html?pagina=' + slug;
      }
      function prova(i) {
        if (i >= candidati.length) return;
        var base = candidati[i];
        fetch(base + 'assets/site.js', { method: 'HEAD' }).then(function (r) {
          if (!r.ok) throw new Error();
          document.getElementById('home').href = base;
          var dest = destinazione(path.slice(base.length - 1));
          if (dest) location.replace(base + dest);
        }).catch(function () { prova(i + 1); });
      }
      prova(0);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Pagina non trovata</h1>
    <p>Questa lince si è persa nel bosco.</p>
    <p><a id="home" href="/">Torna alla home</a></p>
  </main>
</body>
</html>
