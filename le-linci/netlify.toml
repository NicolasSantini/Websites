# Configurazione per Netlify (facoltativa: il sito funziona uguale su GitHub Pages o Cloudflare Pages).
# Sito statico: nessuna build sul server, si pubblica la cartella così com'è.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Vecchi indirizzi WordPress -> nuove pagine (link già stampati su locandine e condivisi sui social)
[[redirects]]
  from = "/effemeride/trail-sul-trebbio/*"
  to = "/trail-sul-trebbio"
  status = 301
[[redirects]]
  from = "/category/trail-sul-trebbio/*"
  to = "/trail-sul-trebbio"
  status = 301
[[redirects]]
  from = "/effemeride/sveglia-presto-running/*"
  to = "/eventi#sveglia-presto"
  status = 301
[[redirects]]
  from = "/effemeride/sotto-la-luna-e-la-torre/*"
  to = "/eventi#sotto-la-luna"
  status = 301
[[redirects]]
  from = "/effemeride/*"
  to = "/eventi"
  status = 301
[[redirects]]
  from = "/il-branco/*"
  to = "/branco"
  status = 301
[[redirects]]
  from = "/abbigliamento/*"
  to = "/branco#abbigliamento"
  status = 301
[[redirects]]
  from = "/about/*"
  to = "/contatti"
  status = 301

# Articoli del blog (/2026/10/01/titolo/): si leggono in notizia.html, che li prende da WordPress.com.
# Gli altri vecchi indirizzi li gestisce 404.html (stesso comportamento su GitHub Pages).
[[redirects]]
  from = "/:anno/:mese/:giorno/:slug/*"
  to = "/notizia.html?articolo=:slug"
  status = 301
[[redirects]]
  from = "/graduatoria/*"
  to = "/notizia.html?pagina=graduatoria"
  status = 301
[[redirects]]
  from = "/rassegna-stampa/*"
  to = "/notizia.html?pagina=rassegna-stampa"
  status = 301
[[redirects]]
  from = "/category/*"
  to = "/archivio"
  status = 301
[[redirects]]
  from = "/tag/*"
  to = "/archivio"
  status = 301
