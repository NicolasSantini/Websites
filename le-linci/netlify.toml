# Sito statico: nessuna build sul server, si pubblica la cartella così com'è.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Vecchi indirizzi WordPress -> nuove pagine (link già stampati su locandine e condivisi sui social)
[[redirects]]
  from = "/effemeride/trail-sul-trebbio/*"
  to = "/trail-sul-trebbio"
  status = 301
[[redirects]]
  from = "/category/trail-sul-trebbio/*"
  to = "/trail-sul-trebbio"
  status = 301
[[redirects]]
  from = "/effemeride/sveglia-presto-running/*"
  to = "/eventi#sveglia-presto"
  status = 301
[[redirects]]
  from = "/effemeride/sotto-la-luna-e-la-torre/*"
  to = "/eventi#sotto-la-luna"
  status = 301
[[redirects]]
  from = "/effemeride/*"
  to = "/eventi"
  status = 301
[[redirects]]
  from = "/il-branco/*"
  to = "/branco"
  status = 301
[[redirects]]
  from = "/graduatoria/*"
  to = "/branco#campionato"
  status = 301
[[redirects]]
  from = "/abbigliamento/*"
  to = "/branco#abbigliamento"
  status = 301
[[redirects]]
  from = "/about/*"
  to = "/contatti"
  status = 301

# Articoli del blog (/2026/10/01/titolo/) e altre pagine: restano su WordPress.com
[[redirects]]
  from = "/:anno/:mese/:giorno/:slug/*"
  to = "https://corriconlelinci.wordpress.com/:anno/:mese/:giorno/:slug/"
  status = 301
[[redirects]]
  from = "/rassegna-stampa/*"
  to = "https://corriconlelinci.wordpress.com/rassegna-stampa/"
  status = 301
[[redirects]]
  from = "/category/*"
  to = "/archivio"
  status = 301
[[redirects]]
  from = "/tag/*"
  to = "/archivio"
  status = 301
