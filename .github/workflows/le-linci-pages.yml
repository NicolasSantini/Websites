# Pubblica la cartella le-linci/ su GitHub Pages a ogni modifica del ramo principale.
# Attivazione una tantum: Settings → Pages → Source: "GitHub Actions" (repo pubblico, gratuito).
name: Sito Le Linci su GitHub Pages

on:
  push:
    branches: [main]
    paths: ['le-linci/**', '.github/workflows/le-linci-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Solo i file del sito: niente documenti di lavoro (PROPOSTA.md, src/, tools/, screenshot)
      - name: Prepara i file pubblici
        run: |
          mkdir _site
          cp le-linci/*.html _site/
          cp -r le-linci/assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
